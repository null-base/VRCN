name: ✨ VRCN CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🧪 Analyze / Lint / Test
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: 🧰 Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: 🩺 Toolchain
        run: |
          mise doctor
          flutter --version
          dart --version

      - name: 📥 Install dependencies
        run: mise run pub-get

      - name: 🎨 Check formatting
        run: mise run format

      - name: 🔍 Analyze
        run: mise run analyze
